namespace: creation
version: creation-v3
targets: [python, dart]

prompts:
  server_music:
    variables: [primary]
    text: |-
      纯音乐，无人声，以{{ primary }}为灵感，自然、轻盈、好奇的儿童探索氛围，柔和木琴、钢琴、轻打击乐，简单原创旋律，舒缓中速，适合作为亲子自然观察短片背景音乐，避免宏大、紧张、悲伤和密集鼓点。

  server_narration:
    variables: [location, primary, short_fact, observation_summary]
    text: |-
      在{{ location }}，我们听见了{{ primary }}。{{ short_fact }}。{{ observation_summary }}。这是一条调查线索，不是最终鉴定。

  server_video:
    variables: [title, primary, status, observation_summary, uncertainty, explanation]
    text: |-
      生成一支9:16竖屏、无字幕、无文字、无人物特写的儿童自然科普短片。地点氛围：中国杭州城市公园。主题：{{ title }}，主要声音线索：{{ primary }}。调查状态：{{ status }}；现场观察摘要：{{ observation_summary }}；不确定性：{{ uncertainty }}。画面表达：{{ explanation }} 镜头缓慢、真实自然、柔和日光、纪录片质感，不捕捉、不触摸、不追逐动物；如无法确定具体物种，只表现环境线索，不出现具体动物近景。

  server_video_timed:
    variables: [duration_seconds, video_prompt]
    text: |-
      生成一支{{ duration_seconds }}秒短片。{{ video_prompt }}

  server_video_negative:
    variables: []
    text: |-
      字幕，文字，水印以外的标识，儿童正脸，捕捉动物，触摸动物，畸形，低清晰度

  mobile_music:
    variables: [location, subject]
    text: |-
      为儿童自然观察创作一段温柔、清澈、富有呼吸感的纯音乐。地点是{{ location }}，声音主题是{{ subject }}。以木琴、轻柔弦乐、原声打击乐和空气感铺底，不要人声，不要歌词，不要戏剧化高潮，给自然原声留出空间。

  mobile_video_bird:
    variables: [location, subject]
    text: |-
      生成一支5秒9:16竖屏单镜头、真实中国{{ location }}城市公园野生动物纪录片。清晨柔和逆光，一只{{ subject }}停在横向树枝上，身体、双脚、翅膀和尾羽完整清晰。0至1.5秒，前景树叶被晨风轻轻推开，镜头从叶片后方极缓慢向前推进，逐渐显露主体。1.5至4秒，主体沿树枝自然地轻跳两步，树枝随落脚轻微下沉后回弹，几滴露水从叶尖落下；主体随后停住，抖动一次羽毛并转头望向画外。4至5秒，镜头继续轻微推进，阳光勾勒羽毛边缘，背景树叶持续缓慢摆动，主体稳定停留在画面视觉中心。动作连续克制，符合真实鸟类运动，身体比例和脚爪结构始终一致。无突然起飞，无重复鸟类，无文字、字幕和人物。

  mobile_video_frog:
    variables: [location, subject]
    text: |-
      生成一支5秒9:16竖屏单镜头、真实中国{{ location }}湿地野生动物纪录片。唯一一只{{ subject }}侧身伏在浅水边的湿润石面，体色、斑纹、自然眼睛比例、四肢结构和皮肤质感全程一致。0至1.5秒，一滴雨水落在主体前方，水面出现扩散涟漪，主体抬起头并缓慢眨眼。1.5至4秒，主体保持身体贴近地面，先转向水面，再自然地向前爬行一个身体长度，前脚依次踏入浅水，后腿保持正常弯曲并缓慢跟进；每次落脚都在水面形成小幅涟漪。镜头沿水面极缓慢横向跟随，不追焦、不变焦。4至5秒，主体在浅水中稳定停下，喉部随呼吸轻微起伏，周围涟漪继续扩散。动作低幅度、连续、符合真实蛙类步态。无跳跃、无腾空、无拉长肢体、无巨大眼睛、无荧光绿色、无肢体融合、无身体膨胀、无多只青蛙、无文字、字幕和人物。

  mobile_video_frog_reference:
    variables: [location, subject]
    text: |-
      生成一支5秒9:16竖屏单镜头、真实中国{{ location }}湿地野生动物纪录片。图片1是{{ subject }}的物种参考，生成视频中的唯一一只蛙必须保持图片1的体色、黑色斑纹、清晰背侧褶、自然眼睛比例、四肢结构和皮肤质感，全程外观一致。雨后低机位贴近浅水岸边，主体侧身伏在湿润石面。0至1.5秒，一滴雨水落在主体前方，水面出现扩散涟漪，主体抬起头并缓慢眨眼。1.5至4秒，主体保持身体贴近地面，先转向水面，再自然地向前爬行一个身体长度，前脚依次踏入浅水，后腿保持正常弯曲并缓慢跟进；每次落脚都在水面形成小幅涟漪。镜头沿水面极缓慢横向跟随，不追焦、不变焦。4至5秒，主体在浅水中稳定停下，喉部随呼吸轻微起伏，周围涟漪继续扩散。动作低幅度、连续、符合真实蛙类步态，身体比例、花纹和颜色始终一致。无跳跃、无腾空、无拉长肢体、无巨大眼睛、无荧光绿色、无肢体融合、无身体膨胀、无多只青蛙、无文字、字幕和人物。

  mobile_video_environment:
    variables: [location]
    text: |-
      生成一支5秒9:16竖屏单镜头、真实中国{{ location }}城市公园湿地纯自然水岸纪录片，环境中没有可见动物。镜头范围只包含湿地水面、芦苇、低矮草叶、露珠和远处模糊树林，不出现任何建筑、亭子、桥梁、道路、现代城市天际线或其他人造设施。0至1.5秒，镜头从沾满露水的低矮草叶之间缓慢向前移动，前景草叶擦过镜头边缘，一滴露珠沿叶尖滑落。1.5至4秒，露珠落入近处浅水，形成清晰的同心涟漪，微风依次吹动近处草叶和远处芦苇，水中树影随波纹轻微变化。4至5秒，镜头只缓慢抬升少许，显露更宽的自然湿地水面和远处连续树线，涟漪逐渐平静。真实水体物理，运动连续自然，前中后景具有空间层次。无动物、人物、文字、字幕、建筑、城市、突然切镜和快速摇晃。

  mobile_narration:
    variables: [location, subject]
    text: |-
      在{{ location }}，我们听见了{{ subject }}。每一种自然声音，都在告诉我们环境正在发生什么。再安静听一听，它的节奏有没有变化？

  mobile_video_negative:
    variables: []
    text: |-
      字幕，水印以外的文字和标志，人物，儿童正脸，笼养，捕捉动物，触摸动物，多只重复动物，额外肢体，额外翅膀，肢体融合，畸形，身体闪烁，形态突变，低清晰度
