name: Android Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag and GitHub Release to publish to
        required: true
        default: "0.4.0"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag
        shell: bash
        working-directory: .
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Validate app version
        shell: bash
        working-directory: .
        run: |
          full_version="$(sed -n 's/^version:[[:space:]]*//p' mobile/pubspec.yaml | head -n 1)"
          app_version="${full_version%%+*}"
          build_number="${full_version#*+}"
          if [[ -z "${full_version}" || "${full_version}" == "${app_version}" ]]; then
            echo "mobile/pubspec.yaml must contain versionName+versionCode" >&2
            exit 1
          fi
          if [[ "${app_version}" != "${RELEASE_TAG}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match app version ${app_version}" >&2
            exit 1
          fi
          if [[ ! "${build_number}" =~ ^[0-9]+$ ]]; then
            echo "Invalid Android build number: ${build_number}" >&2
            exit 1
          fi
          echo "APP_VERSION=${app_version}" >> "${GITHUB_ENV}"
          echo "APP_BUILD_NUMBER=${build_number}" >> "${GITHUB_ENV}"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            mobile/android/*.gradle.kts
            mobile/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Reset generated Android plugins for release
        run: flutter clean

      - name: Build Android arm64 release APK
        run: >-
          flutter build apk
          --release
          --dart-define=ENABLE_DIAGNOSTICS=true
          --target-platform android-arm64
          --build-name "${APP_VERSION}"
          --build-number "${APP_BUILD_NUMBER}"

      - name: Prepare release assets
        shell: bash
        run: |
          apk_name="nature-sound-detective-${RELEASE_TAG}-android-arm64.apk"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${apk_name}"
          cd dist
          sha256sum "${apk_name}" > checksums.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: nature-sound-detective-${{ env.RELEASE_TAG }}-android-arm64
          path: mobile/dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload assets to GitHub Release
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            awk -v version="${RELEASE_TAG}" '
              $0 == "## [" version "]" || index($0, "## [" version "] - ") == 1 {
                capture = 1
                next
              }
              capture && /^## \[/ { exit }
              capture { print }
            ' CHANGELOG.md > release-notes.md
            if [[ ! -s release-notes.md ]]; then
              echo "自然声探员 ${RELEASE_TAG}" > release-notes.md
            fi
            gh release create "${RELEASE_TAG}" \
              --title "自然声探员 ${RELEASE_TAG}" \
              --notes-file release-notes.md
          fi
          gh release upload "${RELEASE_TAG}" \
            mobile/dist/nature-sound-detective-${RELEASE_TAG}-android-arm64.apk \
            mobile/dist/checksums.txt \
            --clobber
