namespace: wan3_experiments
version: wan3-experiments-v4
targets: [python]

prompts:
  current_mobile_baseline:
    variables: []
    text: |-
      生成一支5秒的竖屏儿童自然科普短片。地点氛围：中国杭州的城市公园，主题声音：树麻雀。清晨薄雾、柔和自然光、真实纪录片质感、缓慢稳定镜头。只展示环境和声音线索，不出现文字、字幕、儿童正脸，不表现捕捉或触摸野生动物。不确定具体物种时不要生成动物近景。

  structured_sparrow:
    variables: []
    text: |-
      生成单镜头。清晨的杭州城市公园，中长焦中景，一只树麻雀侧身停在一根横向树枝上，位于画面中部，身体、双脚和尾羽完整可见。树麻雀保持站立，轻轻转头一次，胸羽随呼吸小幅起伏，附近几片树叶被微风轻轻吹动。固定机位，浅景深，柔和自然光，背景安静虚化。真实野生动物纪录片质感，物种外形准确，身体比例自然，动作缓慢克制，画面连续稳定。

  concise_sparrow:
    variables: []
    text: |-
      生成单镜头。清晨杭州公园，一只树麻雀侧身站在横向树枝上，轻轻转头一次。固定机位，中长焦中景，浅景深，柔和自然光，真实野生动物纪录片，动作缓慢自然，身体和脚爪结构准确，画面稳定。

  structured_frog:
    variables: []
    text: |-
      生成单镜头。雨后的杭州城市公园湿地，贴近水面的低机位中景，一只黑斑侧褶蛙安静伏在浅水边，身体侧向镜头，四肢轮廓自然完整。青蛙保持静止，缓慢眨眼一次，一滴水落在附近形成一圈轻微涟漪，岸边湿润草叶小幅摆动。固定机位，柔和阴天自然光，浅景深，真实野生动物纪录片风格，物种外形准确，皮肤纹理自然，动作缓慢稳定。

  uncertain_environment:
    variables: []
    text: |-
      生成单镜头。雨后清晨的杭州城市公园湿地，低机位看向安静的浅水岸边。水面出现两圈轻微涟漪，芦苇和湿润草叶随微风缓慢摆动，远处树影柔和虚化。固定机位，柔和阴天自然光，真实自然纪录片质感，画面连续稳定，环境中没有可见动物。

  negative:
    variables: []
    text: |-
      字幕，文字，标志，儿童正脸，人物，笼养，捕捉动物，触摸动物，多只重复动物，额外肢体，额外翅膀，肢体融合，畸形，身体闪烁，形态突变，低清晰度

  showcase_bird_dynamic:
    variables: []
    text: |-
      5秒9:16竖屏，一镜到底，真实杭州城市公园野生动物纪录片。清晨柔和逆光，一只外形准确的树麻雀停在横向树枝上，身体、双脚、翅膀和尾羽完整清晰。0至1.5秒，前景树叶被晨风轻轻推开，镜头从叶片后方极缓慢向前推进，逐渐显露树麻雀。1.5至4秒，树麻雀沿树枝自然地轻跳两步，树枝随落脚轻微下沉后回弹，几滴露水从叶尖落下；它随后停住，抖动一次羽毛并转头望向画外。4至5秒，镜头继续轻微推进，阳光勾勒羽毛边缘，背景树叶持续缓慢摆动，树麻雀稳定停留在画面视觉中心。动作连续克制，符合真实鸟类运动，身体比例和脚爪结构始终一致。无突然起飞，无重复鸟类，无文字、字幕和人物。

  showcase_environment_dynamic:
    variables: []
    text: |-
      5秒9:16竖屏，一镜到底，真实杭州城市公园自然纪录片，环境中始终没有可见动物。雨后清晨，镜头从沾满露水的低矮草叶之间缓慢向前移动。0至1.5秒，前景草叶擦过镜头边缘，露珠沿叶尖滑落。1.5至4秒，露珠落入浅水，形成由近及远扩散的同心涟漪，微风依次吹动近处草叶和远处芦苇，水中树影随波纹轻微变化。4至5秒，镜头缓慢抬升一点，露出更完整的湿地水面和远处杭州园林轮廓，涟漪逐渐平静。真实水体物理，运动连续自然，前中后景具有空间层次。无动物、人物、文字、字幕、突然切镜和快速摇晃。

  showcase_environment_dynamic_v2:
    variables: []
    text: |-
      5秒9:16竖屏，一镜到底，真实杭州城市公园湿地的一处纯自然水岸，环境中始终没有可见动物。镜头范围只包含湿地水面、芦苇、低矮草叶、露珠和远处模糊树林，不出现任何建筑、亭子、桥梁、道路、现代城市天际线或其他人造设施。雨后清晨，镜头从沾满露水的低矮草叶之间缓慢向前移动。0至1.5秒，前景草叶擦过镜头边缘，一滴露珠沿叶尖滑落。1.5至4秒，露珠落入近处浅水，形成清晰的同心涟漪，微风依次吹动近处草叶和远处芦苇，水中树影随波纹轻微变化。4至5秒，镜头只缓慢抬升少许，显露更宽的自然湿地水面和远处连续树线，涟漪逐渐平静。真实水体物理，运动连续自然，前中后景具有空间层次。无动物、人物、文字、字幕、建筑、城市、突然切镜和快速摇晃。

  showcase_frog_dynamic:
    variables: []
    text: |-
      5秒9:16竖屏，一镜到底，真实杭州湿地野生动物纪录片。主体是一只黑斑侧褶蛙；如果提供图片1，蛙的体色、黑斑、背侧褶、眼睛比例、四肢结构和皮肤质感必须严格参考图片1并全程保持一致。雨后低机位贴近浅水岸边，蛙侧身伏在湿润石面。0至1.5秒，一滴雨水落在蛙前方，水面出现扩散涟漪，蛙抬头观察并缓慢眨眼。1.5至4秒，蛙向前蹬腿，完成一次短距离、低幅度的自然跳跃，落到相邻湿润石块上，落脚处溅起少量水滴；镜头沿水面极缓慢横向跟随。4至5秒，蛙稳定伏下，喉部随呼吸轻微起伏，水面涟漪继续扩散。四肢运动符合真实蛙类结构，落地稳定，身体比例、花纹和颜色始终一致。无巨大眼睛、无荧光绿色、无肢体融合、无身体膨胀、无多只青蛙、无文字、字幕和人物。

  showcase_frog_dynamic_v2:
    variables: []
    text: |-
      5秒9:16竖屏，一镜到底，真实杭州湿地野生动物纪录片。图片1是一只黑斑侧褶蛙的物种参考，生成视频中的唯一一只蛙必须保持图片1的褐绿色体色、黑色斑纹、清晰背侧褶、自然眼睛比例、四肢结构和皮肤质感，全程外观一致。雨后低机位贴近浅水岸边，蛙侧身伏在湿润石面。0至1.5秒，一滴雨水落在蛙前方，水面出现扩散涟漪，蛙抬起头并缓慢眨眼。1.5至4秒，蛙保持身体贴近地面，先转向水面，再自然地向前爬行一个身体长度，前脚依次踏入浅水，后腿保持正常弯曲并缓慢跟进；每次落脚都在水面形成小幅涟漪。镜头沿水面极缓慢横向跟随，不追焦、不变焦。4至5秒，蛙在浅水中稳定停下，喉部随呼吸轻微起伏，周围涟漪继续扩散。动作低幅度、连续、符合真实蛙类步态，身体比例、花纹和颜色始终一致。无跳跃、无腾空、无拉长肢体、无巨大眼睛、无荧光绿色、无肢体融合、无身体膨胀、无多只青蛙、无文字、字幕和人物。
