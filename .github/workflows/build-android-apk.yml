name: Android APK CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test, and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            mobile/android/*.gradle.kts
            mobile/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          java -version
          flutter --version

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Upload golden failure diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures-${{ github.run_number }}
          path: mobile/test/**/failures/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Reset generated Android plugins for release
        run: flutter clean

      - name: Verify AMap Android key
        env:
          AMAP_ANDROID_KEY: ${{ secrets.AMAP_ANDROID_KEY }}
        run: test -n "$AMAP_ANDROID_KEY"

      - name: Build Android arm64 release APK
        env:
          AMAP_ANDROID_KEY: ${{ secrets.AMAP_ANDROID_KEY }}
        run: >-
          flutter build apk
          --release
          --dart-define=ENABLE_DIAGNOSTICS=true
          --target-platform android-arm64
          --split-per-abi
          --build-number "${{ github.run_number }}"

      - name: Prepare APK artifact
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          apk_name="xykw-${GITHUB_RUN_NUMBER}-${short_sha}-arm64.apk"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/${apk_name}"
          cd dist
          sha256sum "${apk_name}" > "${apk_name}.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: xykw-android-arm64-${{ github.run_number }}
          path: mobile/dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
