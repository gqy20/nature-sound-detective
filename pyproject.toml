[project]
name = "nature-sound-detective"
version = "0.1.0"
description = "Hangzhou children's nature-sound AI competition prototype"
requires-python = ">=3.11,<3.12"
dependencies = [
  "birdnet==0.2.16",
  "fastapi>=0.141.1",
  "httpx>=0.28.1",
  "numpy>=1.23.5,<2.0",
  "openai>=2.51.0",
  "python-dotenv>=1.2.2",
  "python-multipart>=0.0.32",
  "tensorflow==2.15.0",
  "tensorflow-intel==2.15.0",
  "tensorflow-io-gcs-filesystem==0.31.0",
  "uvicorn[standard]>=0.52.0",
  "websockets>=15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
